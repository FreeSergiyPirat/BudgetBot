<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Финансовый менеджер</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial; padding: 20px; }
        .tab { display: none; }
        .active { display: block; }
        input, select { margin: 10px 0; width: 100%; padding: 8px; }
        button { background: #0088cc; color: white; border: none; padding: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="main-tab" class="tab active">
        <h2>Баланс: <span id="balance">0 ₽</span></h2>
        <button onclick="showTab('add-transaction')">Добавить операцию</button>
        <button onclick="showTab('history')">История</button>
        <button onclick="showTab('deposit')">Вклады</button>
    </div>

    <div id="add-transaction" class="tab">
        <h3>Добавить операцию</h3>
        <select id="type">
            <option value="income">Доход</option>
            <option value="expense">Расход</option>
        </select>
        <input type="number" id="amount" placeholder="Сумма">
        <input type="text" id="category" placeholder="Категория">
        <button onclick="saveTransaction()">Сохранить</button>
        <button onclick="showTab('main-tab')">Назад</button>
    </div>

    <div id="history" class="tab">
        <h3>История операций</h3>
        <div id="transactions-list"></div>
        <button onclick="showTab('main-tab')">Назад</button>
    </div>

    <div id="deposit" class="tab">
        <h3>Калькулятор вкладов</h3>
        <input type="number" id="deposit-amount" placeholder="Сумма вклада">
        <input type="number" id="deposit-rate" placeholder="Годовая ставка (%)">
        <input type="number" id="deposit-period" placeholder="Срок (мес.)">
        <button onclick="calculateDeposit()">Рассчитать</button>
        <p id="deposit-result"></p>
        <button onclick="showTab('main-tab')">Назад</button>
    </div>

    <script>
        let user = null;

        // Инициализация WebApp
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
        user = Telegram.WebApp.initDataUnsafe.user;

        // Загрузка баланса
        async function loadBalance() {
            const response = await fetch(`http://localhost:5000/api/transactions?user_id=${user.id}`);
            const transactions = await response.json();
            const balance = transactions.reduce((acc, t) => t.type === 'income' ? acc + t.amount : acc - t.amount, 0);
            document.getElementById('balance').textContent = `${balance.toFixed(2)} ₽`;
        }

        // Показ вкладок
        function showTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if(tabId === 'history') loadHistory();
        }

        // Сохранение операции
        async function saveTransaction() {
            const transaction = {
                user_id: user.id,
                amount: parseFloat(document.getElementById('amount').value),
                type: document.getElementById('type').value,
                category: document.getElementById('category').value
            };

            await fetch('http://localhost:5000/api/transaction', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(transaction)
            });

            loadBalance();
            showTab('main-tab');
        }

        // Загрузка истории
        async function loadHistory() {
            const response = await fetch(`http://localhost:5000/api/transactions?user_id=${user.id}`);
            const transactions = await response.json();

            const html = transactions.map(t => `
                <div style="margin: 10px; padding: 10px; border: 1px solid #ccc;">
                    <b>${t.type === 'income' ? '+' : '-'}${t.amount} ₽</b><br>
                    Категория: ${t.category}<br>
                    Дата: ${new Date(t.date).toLocaleDateString()}
                </div>
            `).join('');

            document.getElementById('transactions-list').innerHTML = html;
        }

        // Расчет вклада
        function calculateDeposit() {
            const amount = parseFloat(document.getElementById('deposit-amount').value);
            const rate = parseFloat(document.getElementById('deposit-rate').value);
            const period = parseFloat(document.getElementById('deposit-period').value);

            const result = amount * Math.pow(1 + (rate/100)/12, period);
            document.getElementById('deposit-result').innerHTML = `
                Итоговая сумма: ${result.toFixed(2)} ₽<br>
                Доход: ${(result - amount).toFixed(2)} ₽
            `;
        }

        // Первоначальная загрузка
        loadBalance();
    </script>
</body>
</html>
