<!DOCTYPE html>
<html>
<head>
    <title>Telegram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial; text-align: center; padding: 20px; }
        button { padding: 10px 15px; background: #0088cc; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Моё Mini App</h1>
    <p>Текущий пользователь: <span id="user"></span></p>
    <button onclick="sendData()">Отправить данные в Telegram</button>

    <script>
        // Инициализация WebApp
        Telegram.WebApp.ready();
        document.getElementById('user').innerText =
            Telegram.WebApp.initDataUnsafe.user?.first_name || "Гость";

        // Отправка данных в бота
        function sendData() {
            Telegram.WebApp.sendData("Данные из Mini App!");
            Telegram.WebApp.close();
        }
    </script>
</body>
</html>
